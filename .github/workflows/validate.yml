name: Validate Swim KPS publication

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate knowledge structure, links and typed references
        run: python3 validate.py .
      - name: Run regression tests
        run: python3 test_validate.py
